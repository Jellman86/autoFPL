name: Feature proposal
description: Propose a vertically sliced product capability
title: "feat: "
labels: ["type: feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and user decision
      description: Describe the decision/outcome, not a preferred implementation.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable, testable criteria and failure behaviour.
    validations:
      required: true
  - type: textarea
    id: non_goals
    attributes:
      label: Non-goals
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and alternatives
      description: Link sources, comparable systems and simpler baselines.
    validations:
      required: true
  - type: textarea
    id: risk
    attributes:
      label: Security, privacy, compliance and data-rights risks
    validations:
      required: true
  - type: checkboxes
    id: boundary
    attributes:
      label: Product boundary
      options:
        - label: This does not introduce FPL scraping, credential/session access or automatic account action.
          required: true
