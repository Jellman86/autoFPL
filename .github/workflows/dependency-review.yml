name: Dependency review

on:
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: dependency-review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          vulnerability-check: true
          license-check: true
          fail-on-severity: moderate
          allow-licenses: >-
            0BSD, Apache-2.0, BSD-2-Clause, BSD-3-Clause, BSL-1.0,
            CC0-1.0, ISC, MIT, PSF-2.0, Python-2.0, Unicode-3.0,
            Unlicense, Zlib, GPL-3.0-only, GPL-3.0-or-later,
            LGPL-3.0-only, LGPL-3.0-or-later, AGPL-3.0-only,
            AGPL-3.0-or-later
