name: Governance

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: governance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-policy:
    name: repository-policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Install locked governance dependencies
        run: >-
          python3 -m pip install --disable-pip-version-check --require-hashes
          --requirement requirements-governance.txt
      - name: Restore locked .NET dependencies
        run: dotnet restore src/backend/AutoFpl.slnx --locked-mode --nologo
      - name: Run .NET tests
        run: >-
          dotnet test src/backend/AutoFpl.slnx --no-restore
          --configuration Release --nologo
      - name: Run governance tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Enforce admitted data-source policy
        run: python3 tools/governance/check_data_source_policy.py
      - name: Validate documentation
        run: python3 tools/governance/check_documentation.py
      - name: Validate pull request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python3 tools/governance/check_pr_title.py
      - name: Enforce repository policy
        run: python3 tools/governance/check_repository.py
